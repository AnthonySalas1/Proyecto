<section>
  <div class="container-fluid">
    <div class="busqueda d-block">
      <div class="col-12">
        <h1>Catálogo de Productos</h1>
      </div>
      <div class="col-sm-12 p-1">
        <form [formGroup]="busquedaForm">
          <div class="row">
            <div class="col-sm-6 m-0 p-0">
              <input
                class="input-group-text w-100"
                type="text"
                placeholder="Buscar producto..."
                [formControl]="terminoBusqueda"
              />
            </div>
            <div class="col-sm-3">
              <label class="w-25" for="marca">Marca: </label>
              <select
                aria-label="Marca: "
                class="form-select w-75 d-inline"
                id="marca"
                name="role_default"
                formControlName="marca"
              >
                <option selected value=""></option>
                <option *ngFor="let marca of listaMarcas" [value]="marca.id">
                  {{ marca.nombreMarca }}
                </option>
              </select>
            </div>
            <div class="col-sm-3">
              <label class="w-25" for="talla">Talla: </label>
              <select
                class="form-select w-75 d-inline"
                id="talla"
                name="role_default"
                formControlName="talla"
              >
                <option value=""></option>
                <option *ngFor="let talla of listaTallas" [value]="talla.id">
                  {{ talla.numeroCalzado }}
                </option>
              </select>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
<section style="position: absolute; top: 20%">
  <div
    class="d-flex justify-content-center flex-wrap m-3"
    style="position: relative"
  >
    <div
      class="card shadow rounded-mx-2 p-2 m-2"
      *ngFor="let producto of listaFiltradaProductos"
    >
      <div
        class="card bg-c-black order-card"
        style="background-image: linear-gradient(to right, #ffffff, #e7e9ff)"
      >
        <div class="modal-header">
          <h3
            style="color: rgb(38, 0, 53)"
            heigh="250px"
            class="card-title p-1"
            for=""
          >
            {{ producto.nombreProducto }}
          </h3>
        </div>
        <div>
          <a
            class="btn border-5 rounded-5"
            (click)="abrirComponenteModal(producto)"
            ><img
              class=""
              height="250"
              width="250"
              src="{{ producto.imagenBase64 }}"
          /></a>
        </div>
        <div class="m-1">
          <h5 style="color: rgb(38, 0, 53)" for="">
            Color: {{ producto.Color?.nombreColor }}
          </h5>
          <h5 style="color: rgb(38, 0, 53)" class="m-1" for="">
            Marca: {{ producto.Marca?.nombreMarca }}
          </h5>
          <h5 style="color: rgb(38, 0, 53)" class="m-1" for="">
            Modelo: {{ producto.Modelo?.nombreModelo }}
          </h5>
          <h5 style="color: rgb(38, 0, 53)" class="m-1" for="">
            Talla: {{ producto.Talla?.numeroCalzado }}
          </h5>
        </div>
      </div>
    </div>
  </div>
</section>
